# CRM API contract — single source of truth for the backend and the web app.
# Rules, workflow and the binding operationId table: see README.md in this folder.
# After every edit: cd backend && npm run api:generate
openapi: 3.1.0
info:
  title: CRM API
  version: 1.0.0
  summary: Contract for the CRM backend (Express) and the Angular web app.
  description: |
    Hand-written OpenAPI 3.1 contract. One file per area under `paths/` and
    `schemas/`; shared parts live in `common.yaml`.

    Error answers always use `ErrorResponse`. Texts are German.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /api

tags:
  - name: health
    description: Liveness probe.
  - name: auth
    description: Session login, logout and the current user.
  - name: firmen
    description: Companies (Firma), the top-level CRM record.
  - name: personen
    description: Contacts (Person) at a company.
  - name: abteilungen
    description: Departments (Abteilung) inside a company.
  - name: adressen
    description: Postal addresses (Adresse).
  - name: aktivitaeten
    description: Logged interactions (Aktivitaet).
  - name: chancen
    description: Sales opportunities (Chance).
  - name: dashboard
    description: Aggregated numbers for the start page.
  - name: szenarien
    description: Saved scenarios for the cycle-time calculator.
  - name: agent-tasks
    description: Work queue of the autonomous agent-task runner.
  - name: tickets
    description: Kanban ticket system for the software-factory training.
  - name: cron
    description: Scheduled and manual CI workflow dispatches.

# No global `security`: every operation states its own rule (README, "Security mapping").
