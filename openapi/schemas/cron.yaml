# Area: cron. Source: backend/src/routes/cron.ts, backend/src/services/cronService.ts,
# backend/src/config/cronJobs.ts.

CronRunStatus:
  type: string
  enum: [RUNNING, SUCCESS, FAILED, SKIPPED]

CronTrigger:
  type: string
  description: '`CRON` for the `CRON_SECRET` bearer, `MANUAL` for an admin session.'
  enum: [CRON, MANUAL]

CronRun:
  type: object
  additionalProperties: false
  required:
    - id
    - job
    - status
    - trigger
    - startedAt
    - finishedAt
    - durationMs
    - result
    - githubRunUrl
    - error
  properties:
    id:
      type: integer
    job:
      type: string
      description: Job name, for example `solve-tasks`.
    status:
      $ref: '#/CronRunStatus'
    trigger:
      $ref: '#/CronTrigger'
    startedAt:
      type: string
      description: ISO-8601 time.
    finishedAt:
      type: [string, 'null']
      description: ISO-8601 time.
    durationMs:
      type: [integer, 'null']
    result:
      type: [string, 'null']
      description: JSON string, `{"skipReason":...}` or `{"tasksSolved":...,"tasksRejected":...}`.
    githubRunUrl:
      type: [string, 'null']
    error:
      type: [string, 'null']

CronRunPage:
  type: object
  allOf:
    - $ref: '../common.yaml#/schemas/PageMeta'
    - type: object
      required: [content]
      properties:
        content:
          type: array
          items:
            $ref: '#/CronRun'
  unevaluatedProperties: false

CronJobLastRun:
  type: [object, 'null']
  description: Newest run of the job, or null when it never ran. Same fields as `CronRun`.
  additionalProperties: false
  required:
    - id
    - job
    - status
    - trigger
    - startedAt
    - finishedAt
    - durationMs
    - result
    - githubRunUrl
    - error
  properties:
    id:
      type: integer
    job:
      type: string
    status:
      $ref: '#/CronRunStatus'
    trigger:
      $ref: '#/CronTrigger'
    startedAt:
      type: string
    finishedAt:
      type: [string, 'null']
    durationMs:
      type: [integer, 'null']
    result:
      type: [string, 'null']
    githubRunUrl:
      type: [string, 'null']
    error:
      type: [string, 'null']

CronJob:
  type: object
  additionalProperties: false
  required: [name, schedule, description, dispatchEventType, lastRun]
  properties:
    name:
      type: string
    schedule:
      type: string
      description: Cron expression, or `manuell`.
    description:
      type: string
    dispatchEventType:
      type: string
      description: GitHub `repository_dispatch` event type.
    lastRun:
      $ref: '#/CronJobLastRun'

CronRunCompleteInput:
  type: object
  required: [status, tasksSolved, tasksRejected, githubRunUrl]
  properties:
    status:
      type: string
      enum: [SUCCESS, FAILED]
      x-error-messages:
        required: Ungültiger Status
        type: Ungültiger Status
        enum: Ungültiger Status
    tasksSolved:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      x-error-messages:
        minimum: Darf nicht negativ sein
        maximum: Ungültiger Wert
    tasksRejected:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      x-error-messages:
        minimum: Darf nicht negativ sein
        maximum: Ungültiger Wert
    githubRunUrl:
      type: string
      format: uri
      x-error-messages:
        required: Ungültige URL
        type: Ungültige URL
        format: Ungültige URL
