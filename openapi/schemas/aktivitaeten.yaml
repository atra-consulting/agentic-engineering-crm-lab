# Area: aktivitaeten. Source of response shapes: backend/src/services/aktivitaetService.ts (AktivitaetDTO, toDTO).
# This file is the source of truth for input validation.

AktivitaetTyp:
  type: string
  enum: [ANRUF, EMAIL, MEETING, NOTIZ, AUFGABE]

Aktivitaet:
  type: object
  description: An activity (call, email, meeting, note, task), optionally linked to a company and a contact.
  additionalProperties: false
  required:
    - id
    - typ
    - subject
    - description
    - datum
    - firmaId
    - firmaName
    - personId
    - personName
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
    typ:
      $ref: '#/AktivitaetTyp'
    subject:
      type: string
    description:
      type: [string, 'null']
    datum:
      type: string
      description: Free text as sent by the client (no format enforced).
    firmaId:
      type: [integer, 'null']
    firmaName:
      type: [string, 'null']
    personId:
      type: [integer, 'null']
    personName:
      type: [string, 'null']
      description: '`firstName lastName`; only one part if the other is empty; null without contact.'
    createdAt:
      type: string
      description: ISO-8601 text as stored. Seed rows use a space instead of `T`.
    updatedAt:
      type: string
      description: ISO-8601 text as stored. Seed rows use a space instead of `T`.

AktivitaetPage:
  type: object
  description: One page of activities.
  allOf:
    - $ref: '../common.yaml#/schemas/PageMeta'
    - type: object
      required: [content]
      properties:
        content:
          type: array
          items:
            $ref: '#/Aktivitaet'
  unevaluatedProperties: false

AktivitaetInput:
  type: object
  description: |
    Body for create and full update. `typ`, `subject` and `datum` are required.
    A left-out optional field is stored as null. Unknown fields are stripped.
  required: [typ, subject, datum]
  properties:
    typ:
      type: string
      description: Same values as `AktivitaetTyp`. Inline so the error texts sit next to `enum`.
      enum: [ANRUF, EMAIL, MEETING, NOTIZ, AUFGABE]
      x-error-messages:
        required: Ungültiger Typ
        type: Ungültiger Typ
        enum: Ungültiger Typ
    subject:
      type: string
      minLength: 1
      maxLength: 255
      x-error-messages:
        required: Betreff ist erforderlich
        type: Betreff ist erforderlich
        minLength: Betreff ist erforderlich
    description:
      type: [string, 'null']
    datum:
      type: string
      minLength: 1
      x-error-messages:
        required: Datum ist erforderlich
        type: Datum ist erforderlich
        minLength: Datum ist erforderlich
    firmaId:
      type: [integer, 'null']
      minimum: 1
      maximum: 9007199254740991
      x-error-messages:
        type: Ungültige ID
        minimum: Ungültige ID
        maximum: Ungültige ID
    personId:
      type: [integer, 'null']
      minimum: 1
      maximum: 9007199254740991
      x-error-messages:
        type: Ungültige ID
        minimum: Ungültige ID
        maximum: Ungültige ID
